<style>
  :root { --u: 1px; --f: "Lilita One", "Segoe UI Black", "Arial Black", system-ui, sans-serif; }
  * { box-sizing: border-box; }

  /* Düğmeler */

    background: linear-gradient(#ffe26a 0%, #ffc21f 45%, #f09a0c 100%); text-shadow: 0 2px 0 #7a4a00, 0 0 2px #7a4a00; box-shadow: inset 0 calc(var(--u) * 3) 0 #fff6, 0 calc(var(--u) * 4) 0 #3a2200; display: inline-flex; align-items: center; justify-content: center; gap: calc(var(--u) * 6); }

  #nav { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: linear-gradient(#173a85, #0b2357); border-top: calc(var(--u) * 3) solid #000; }
  #nav b { display: flex; flex-direction: column; align-items: center; padding: calc(var(--u) * 6) 0 calc(var(--u) * 5); font-size: calc(var(--u) * 24); cursor: pointer; opacity: .75; border-right: 1px solid #0006; }

  /* Kartlar */

  .gem { position: absolute; top: calc(var(--u) * 3); left: 50%; width: calc(var(--u) * 13); height: calc(var(--u) * 13); margin-left: calc(var(--u) * -6); transform: rotate(45deg); z-index: 3; background: linear-gradient(135deg, #e3e9f0, #7d8b9e); border: 2px solid #2b3440; }

  @keyframes gp { 50% { transform: rotate(45deg) scale(1.3); } }
  .card.evo { border-color: #e6b6ff; box-shadow: 0 0 0 2px #7a2fc2, 0 0 calc(var(--u) * 12) #c46bff, 0 calc(var(--u) * 3) 0 #000a; }

  .prog { position: relative; height: calc(var(--u) * 13); background: #0009; border-radius: 99px; overflow: hidden; margin-top: calc(var(--u) * 3); border: 2px solid #000; }

  .deckTabs b.on { background: linear-gradient(#ffe26a, #f09a0c); text-shadow: 0 2px 0 #7a4a00; }
  .deckGrid { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(var(--u) * 9); padding: calc(var(--u) * 10); }
  .deckGrid .cw { z-index: 1; position: relative; }
  .evoZone { grid-column: 1 / 3; grid-row: 1; align-self: stretch; margin: calc(var(--u) * -6); border-radius: calc(var(--u) * 14); z-index: 0; background: linear-gradient(#8a4be0, #4a1d9a); border: calc(var(--u) * 3) solid #d9a8ff; box-shadow: 0 0 calc(var(--u) * 16) #b35cffaa; }
  .evoZone::after { content: 'EVRİM'; position: absolute; margin-top: calc(var(--u) * -12); margin-left: calc(var(--u) * 6); font-size: calc(var(--u) * 11); background: #4a1d9a; padding: 0 calc(var(--u) * 6); border-radius: 6px; border: 2px solid #d9a8ff; }

  /* Mağaza / yol / arkadaş */
